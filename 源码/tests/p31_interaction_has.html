<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 16px sans-serif; }
  .box { width: 200px; height: 40px; background: #dddddd; }
  .a:has(> .hot) { background: #ff0000; }
  .b:has(.deep) { background: #00ff00; }
  .c:has(+ .sib) { background: #0000ff; }
  .h { width: 200px; height: 40px; background: #eeeeee; }
  .h:hover { background: #ff9900; }
  .f { width: 200px; height: 40px; background: #dddddd; }
  .f:focus { background: #9900ff; }
  .wrap { width: 200px; height: 40px; background: #cccccc; }
  .wrap:focus-within { background: #00cccc; }
  label { display: block; width: 200px; height: 40px; background: #eeeeee; }
  label:has(input:checked) { background: #ff00ff; }
  .sib { width: 200px; height: 20px; background: #888888; }
  .act { width: 200px; height: 30px; background: #dddddd; }
  .act:active { background: #ff8800; }
  .tg { width: 200px; height: 30px; background: #dddddd; }
  .tg:target { background: #008800; }
  .fv { width: 200px; height: 30px; background: #dddddd; }
  .fv:focus-visible { background: #880088; }
  a.vl { display: block; width: 200px; height: 30px; background: #dddddd; color: #000000; }
  a.vl:visited { background: #333333; }
</style></head>
<body>
<div class="box a" id="a"><span class="hot">hot</span></div>
<div class="box b" id="b"><span><em class="deep">deep</em></span></div>
<div class="box c" id="c">c</div>
<div class="sib" id="sib">sibling</div>
<div class="h" id="h">hover me</div>
<div class="f" id="f" tabindex="0">focus me</div>
<div class="wrap" id="wrap"><span id="inner">inner</span></div>
<label id="lab"><input type="checkbox" id="cb"> check</label>
<div class="act" id="act">active</div>
<div class="tg" id="tg">target</div>
<div class="fv" id="fv" tabindex="0">focus-visible</div>
<a class="vl" id="vl" href="#demo">visited</a>
</body></html>
