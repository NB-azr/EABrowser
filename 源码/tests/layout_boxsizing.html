<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; background: #EEF2F7; }
#cb { width: 200px; height: 100px; padding: 20px; border: 5px solid #000; background: #F05A28; }
#cb-in { width: 100%; height: 20px; background: #FFD9C9; }
#bb { box-sizing: border-box; width: 200px; height: 100px; padding: 20px; border: 5px solid #000; background: #4C8DF6; }
#bb-in { width: 100%; height: 20px; background: #D6E4FF; }
#auto { padding: 15px; background: #28A745; }
</style>
</head>
<body>
<div id="cb"><div id="cb-in"></div></div>
<div id="bb"><div id="bb-in"></div></div>
<div id="auto">auto width content</div>
</body>
</html>
