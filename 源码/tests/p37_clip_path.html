<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 12px sans-serif; }
  .c { width: 200px; height: 120px; background: rgb(0, 160, 0); margin: 8px; }
  #cp1 { clip-path: polygon(0 0, 100% 0, 0 100%); }
  #cp2 { clip-path: path("M0,0 L200,0 L200,120 Z"); }
  #cp3 { clip-path: url(#tri); }
  #cp4 { clip-path: circle(50% at 50% 50%); }
  #cp5 { clip-path: inset(10px 20px); }
</style></head>
<body>
<svg width="0" height="0"><clipPath id="tri" clipPathUnits="userSpaceOnUse"><polygon points="0,0 200,0 0,120"/></clipPath></svg>
<div class="c" id="cp1">a</div>
<div class="c" id="cp2">b</div>
<div class="c" id="cp3">c</div>
<div class="c" id="cp4">d</div>
<div class="c" id="cp5">e</div>
</body></html>
