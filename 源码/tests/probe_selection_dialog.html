<!doctype html><html><head><meta charset="utf-8"><style>
::selection{background-color:rgb(255,0,0);color:rgb(255,255,255)}
#host::selection{background-color:rgb(0,0,255)}
#dlg{background:rgb(240,240,240);border:1px solid #333}
</style></head><body>
<div id="host">selection host</div>
<dialog id="dlg"><p>dialog body</p><button id="ok">ok</button></dialog>
<script>
console.log('[M6] body selection bg='+getComputedStyle(document.body,'::selection').backgroundColor+
  ' color='+getComputedStyle(document.body,'::selection').color);
console.log('[M6] host selection bg='+getComputedStyle(document.getElementById('host'),'::selection').backgroundColor);
console.log('[M6] supports selection='+CSS.supports('selector(::selection)'));

var d=document.getElementById('dlg');
console.log('[M6] ctor='+(typeof HTMLDialogElement)+' instanceof='+(d instanceof HTMLDialogElement)+
  ' openAttr='+d.hasAttribute('open')+' display='+getComputedStyle(d).display);
d.showModal();
console.log('[M6] after showModal open='+d.open+' display='+getComputedStyle(d).display+
  ' modal='+d.__dialogModal);
var closed=0, cancelled=0;
d.addEventListener('close',function(){ closed++; });
d.addEventListener('cancel',function(){ cancelled++; });
d.returnValue='first';
d.close('done');
console.log('[M6] after close open='+d.open+' display='+getComputedStyle(d).display+
  ' rv='+d.returnValue+' closeEvents='+closed);
d.addEventListener('cancel',function(e){ e.preventDefault(); });
d.show();
d.requestClose('blocked');
console.log('[M6] requestClose canceled: open='+d.open+' cancelEvents='+cancelled);
d.show();
try{ d.show(); }catch(e){ console.log('[M6] double-show throws '+e.name); }
d.close();
</script></body></html>
