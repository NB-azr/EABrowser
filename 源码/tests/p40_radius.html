<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; }
  .b { width: 200px; height: 100px; background: #4488CC; margin: 10px; }
  #a { border-radius: 40px; }
  #bb { width: 100px; height: 100px; border-radius: 50%; }
  #c { border-radius: 60px / 20px; }
  #d { border-radius: 80px 20px 40px 10px; }
  #e { border-radius: 150px; }
  #f { border-top-left-radius: 30px 10px; border-top-right-radius: 20px; }
  #g { border: 6px solid #222; border-radius: 25% 10%; }
</style></head>
<body>
<div class="b" id="a"></div>
<div class="b" id="bb"></div>
<div class="b" id="c"></div>
<div class="b" id="d"></div>
<div class="b" id="e"></div>
<div class="b" id="f"></div>
<div class="b" id="g"></div>
</body></html>
