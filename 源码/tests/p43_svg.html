<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 14px Arial; }
  #host { width: 400px; height: 220px; }
  svg { display: block; }
</style></head>
<body>
<div id="host">
<svg id="svg" width="400" height="220" viewBox="0 0 400 220">
  <defs>
    <pattern id="pat" width="10" height="10" patternUnits="userSpaceOnUse">
      <rect width="5" height="10" fill="#FF8800"></rect>
      <rect x="5" width="5" height="10" fill="#0088FF"></rect>
    </pattern>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0"
                    gradientTransform="rotate(90)" spreadMethod="repeat">
      <stop offset="0" stop-color="#FF0000"></stop>
      <stop offset="1" stop-color="#0000FF"></stop>
    </linearGradient>
  </defs>

  <!-- 1 path 填充：矩形路径 -->
  <path id="pathRect" d="M10 10 H60 V50 H10 Z" fill="#3366CC"></path>

  <!-- 2 polygon 填充：三角形 -->
  <polygon id="tri" points="80,10 120,50 80,50" fill="#22AA44"></polygon>

  <!-- 3 A 弧线：半圆描边 -->
  <path id="arc" d="M150 60 A 30 30 0 1 1 190 60" fill="none" stroke="#000000" stroke-width="2"></path>

  <!-- 4 pattern 平铺填充 -->
  <rect id="patRect" x="10" y="80" width="60" height="30" fill="url(#pat)"></rect>

  <!-- 5 gradientTransform(rotate 90) + spreadMethod(repeat) -->
  <rect id="gradRect" x="90" y="80" width="80" height="40" fill="url(#g1)"></rect>

  <!-- 6 transform translate+rotate+scale -->
  <g transform="translate(120,160) rotate(30) scale(1.5)">
    <rect id="rotRect" x="0" y="0" width="20" height="10" fill="#AA00AA"></rect>
  </g>

  <!-- 7 transform scale -->
  <g transform="scale(2)">
    <rect id="scaleRect" x="100" y="75" width="20" height="10" fill="#DD8800"></rect>
  </g>
</svg>
</div>
</body></html>
