<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>mix-blend-mode / background-attachment: fixed</title>
<style>
  body { margin: 0; padding: 0; background: #ffffff; }
  div { margin: 0; }
  #scroll { width: 200px; height: 80px; margin-top: 40px;
            background: #ffdddd url(bg_scroll.png); }
  #fixed  { width: 200px; height: 80px; margin-top: 20px;
            background: #ddeeff url(bg_fixed.png) fixed; }
  #fixedsz { width: 200px; height: 80px; margin-top: 20px;
             background-image: url(bg_tile.png); background-attachment: fixed;
             background-size: 100px 50px; background-repeat: repeat; }
  #layerfix { width: 200px; height: 80px; margin-top: 20px;
              background: url(bg_a.png) fixed, #eeeeee; }
  #blendbox { mix-blend-mode: multiply; background: #00ff00; width: 120px; height: 40px; margin-top: 20px; }
  #blendbox span { color: #0000ff; font-size: 14px; }
</style></head>
<body>

<div id="scroll"></div>
<div id="fixed"></div>
<div id="fixedsz"></div>
<div id="layerfix"></div>

<div id="blendbox"><span id="btxt">Blend Text</span></div>

</body></html>
