<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font-size: 14px; }
#cap { width: 200px; max-height: 60px; background: #ffcccc; overflow: hidden; }
#cap p { margin: 0; height: 200px; background: #ff9999; }
#min { width: 200px; min-height: 40px; background: #ccffcc; }
#min span { display: block; height: 10px; background: #99ff99; }
#both { width: 200px; height: 80px; max-height: 30px; background: #ccccff; }
#maxw { width: 300px; max-width: 120px; min-width: 90px; height: 20px; background: #ffffcc; }
#auto { width: 200px; max-height: 60px; background: #eeeeee; }
#auto p { margin: 0; height: 40px; }
</style></head>
<body>
<div id="cap"><p></p></div>
<div id="min"><span></span></div>
<div id="both"></div>
<div id="maxw"></div>
<div id="auto"><p></p></div>
</body></html>
