<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; }
#box { width: 100px; height: 60px; background: #336699; opacity: 1; color: #222222;
       transition: opacity 0.5s, background-color 0.5s, color 0.5s, width 0.5s; }
#fade { width: 100px; height: 30px; background: #ff0000; transition: transform 0.4s; }
</style></head>
<body>
<div id="box">transition box</div>
<div id="fade"></div>
</body></html>
