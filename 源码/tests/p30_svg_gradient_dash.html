<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; }
  svg { display: block; }
  div { outline: 1px solid #ccc; }
</style></head>
<body>
<div id="lin">
<svg width="200" height="90" viewBox="0 0 200 90">
  <defs>
    <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0000"/>
      <stop offset="0.5" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#0000ff"/>
    </linearGradient>
    <linearGradient id="g2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffaa00"/>
      <stop offset="1" stop-color="#aa00ff" stop-opacity="0.4"/>
    </linearGradient>
    <linearGradient id="g4" x1="10" y1="0" x2="90" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00aa55"/>
      <stop offset="1" stop-color="#ff00ff"/>
    </linearGradient>
  </defs>
  <rect id="r1" x="0" y="0" width="200" height="30" fill="url(#g1)"/>
  <rect id="r2" x="0" y="30" width="100" height="30" fill="url(#g2)"/>
  <rect id="r3" x="0" y="60" width="200" height="20" fill="url(#g4)"/>
</svg>
</div>
<div id="rad">
<svg width="80" height="80" viewBox="0 0 80 80">
  <defs>
    <radialGradient id="g3" cx="0.5" cy="0.5" r="0.6">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#0066cc"/>
    </radialGradient>
  </defs>
  <circle id="c1" cx="40" cy="40" r="40" fill="url(#g3)"/>
</svg>
</div>
<div id="dash">
<svg width="200" height="70" viewBox="0 0 200 70">
  <line id="l1" x1="10" y1="20" x2="190" y2="20" stroke="#333333" stroke-width="4" stroke-dasharray="20 10"/>
  <rect id="r4" x="10" y="35" width="180" height="20" fill="none" stroke="#333333" stroke-width="3" stroke-dasharray="8 6"/>
</svg>
</div>
<div id="dashgrad">
<svg width="200" height="60" viewBox="0 0 200 60">
  <defs>
    <linearGradient id="g5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00ff00"/>
      <stop offset="1" stop-color="#ff0000"/>
    </linearGradient>
  </defs>
  <line id="l2" x1="10" y1="30" x2="190" y2="30" stroke="url(#g5)" stroke-width="6" stroke-dasharray="30 12"/>
</svg>
</div>
</body></html>
