<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; font-size: 14px; }
  .row { margin: 6px; padding: 2px; background: #eee; }
  /* A：资源层登记了固有尺寸 120x60，未给 CSS 宽高 */
  #a::before { content: url(pic.png); }
  #a { min-height: 62px; }
  /* B：资源层没有登记，退回 32x32 */
  #b::before { content: url(unknown.png); }
  #b { min-height: 34px; }
  /* C：只给宽度，按固有比例补高度（120x60 -> 80x40） */
  #c::before { content: url(pic.png); width: 80px; }
  #c { min-height: 42px; }
  /* D：CSS 宽高显式 50x50，忽略固有比例 */
  #d::before { content: url(pic.png); width: 50px; height: 50px; }
  #d { min-height: 52px; }
</style>
</head>
<body>
  <div id="a" class="row">A 固有尺寸</div>
  <div id="b" class="row">B 无尺寸回退</div>
  <div id="c" class="row">C 只给宽</div>
  <div id="d" class="row">D 显式宽高</div>
  <img id="e" src="pic.png" alt="img 固有尺寸">
</body></html>
