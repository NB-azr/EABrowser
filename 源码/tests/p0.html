<!DOCTYPE html>
<html>
<head>
<style>
body { margin: 0; background: #F2F3F5; font-size: 16px; }
#tall { height: 1700px; }

/* 1) position:fixed 底部栏：应固定在视口底部，不随文档流 */
#fixedbar {
  position: fixed; left: 0; bottom: 0; width: 100%; height: 64px;
  background: #1F1F1F; color: #FFFFFF; border-radius: 0;
}

/* 2) box-shadow */
#card {
  position: absolute; left: 40px; top: 120px; width: 300px; height: 140px;
  background: #FFFFFF; border-radius: 18px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
}

/* 3) @keyframes 缩放 + 透明度动画（alternate 往复） */
#pulse {
  position: absolute; left: 40px; top: 340px; width: 120px; height: 120px;
  background: #4C8DF6; border-radius: 60px;
  animation: pulse 1s linear infinite alternate;
}
@keyframes pulse {
  0%   { transform: scale(1);   opacity: 1; }
  50%  { transform: scale(1.4); opacity: 0.6; }
  100% { transform: scale(1);   opacity: 1; }
}

/* 5) filter: blur / backdrop-filter: blur */
#blurred {
  position: absolute; left: 420px; top: 340px; width: 160px; height: 100px;
  background: #9C27B0; border-radius: 12px; filter: blur(8px);
}
#glass {
  position: absolute; left: 620px; top: 340px; width: 180px; height: 120px;
  background: rgba(255, 255, 255, 0.5); border-radius: 16px;
  backdrop-filter: blur(12px);
}

/* 6) @keyframes 平移 */
#slide {
  position: absolute; left: 240px; top: 340px; width: 100px; height: 100px;
  background: #F05A28; border-radius: 12px;
  animation: slide 2s linear infinite;
}
@keyframes slide {
  0%   { transform: translateX(0px); }
  100% { transform: translateX(200px); }
}
</style>
</head>
<body>
<div id="tall">文档流占位（用于验证 fixed 不跟随滚动）</div>
<div id="card">box-shadow 卡片</div>
<div id="pulse"></div>
<div id="blurred"></div>
<div id="glass"></div>
<div id="slide"></div>
<div id="fixedbar">固定底栏 fixed bottom</div>
</body>
</html>
