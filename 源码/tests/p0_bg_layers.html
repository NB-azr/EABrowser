<!doctype html>
<html><head><style>
body { margin: 0; }
#bg1 { width: 200px; height: 100px; background-image: url(a.png); background-position: 10px 20px; background-repeat: no-repeat; background-size: 50px 30px; }
#bg2 { width: 200px; height: 100px; background-image: url(b.png); background-position: center; background-repeat: repeat-x; background-size: 40px 20px; }
#bg3 { width: 200px; height: 100px; background-image: url(c.png), url(d.png); background-size: 60px 40px, 100% 50%; background-position: 0 0, center; background-repeat: no-repeat, no-repeat; background-color: #336699; }
#bg4 { width: 200px; height: 100px; background: url(e.png) center/cover no-repeat #cccccc; }
#bg5 { width: 200px; height: 100px; background-image: url(f.png), url(g.png); background-repeat: repeat-x, repeat-y; background-size: 30px 30px; }
</style></head>
<body>
<div id="bg1"></div>
<div id="bg2"></div>
<div id="bg3"></div>
<div id="bg4"></div>
<div id="bg5"></div>
</body></html>
