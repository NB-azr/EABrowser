<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 10px sans-serif; }
  .spacer { height: 100px; background: #eee; }
  #box { height: 300px; background: #ddeeff; position: relative; }
  #st { position: sticky; top: 20px; height: 60px; background: #ff8800; }
  #box2 { height: 300px; background: #eef7dd; margin-top: 40px; }
  #sb { position: sticky; bottom: 10px; height: 50px; background: #22aa66; margin-top: 200px; }
  #sc { height: 160px; overflow-y: auto; background: #f8e8f8; margin-top: 40px; }
  #st2 { position: sticky; top: 10px; height: 40px; background: #aa44aa; }
</style></head>
<body>
<div class="spacer"></div>
<div id="box"><div id="st">sticky</div></div>
<div id="box2"><div id="sb">bottom</div></div>
<div id="sc"><div id="st2">inner</div></div>
<div class="spacer"></div>
</body></html>
