<!doctype html><html><head><meta charset="utf-8"><style>
#x::part(label){color:rgb(255,0,0)}
#x::part(icon button){background-color:rgb(0,0,255)}
#y::slotted(span){color:rgb(0,128,0)}
#z::slotted(*){background-color:rgb(255,255,0)}
</style></head><body>
<div id="x"><span part="label">p</span><i part="icon">i</i></div>
<div id="y"><span id="sl">s</span></div>
<div id="z"><b id="sb">b</b></div>
<script>
console.log('[N3] label color='+getComputedStyle(document.querySelector('#x span')).color+
  ' icon bg='+getComputedStyle(document.querySelector('#x i')).backgroundColor);
console.log('[N3] slotted color='+getComputedStyle(document.getElementById('sl')).color+
  ' sb bg='+getComputedStyle(document.getElementById('sb')).backgroundColor);
console.log('[N3] supports part='+CSS.supports('selector(::part(label))')+
  ' slotted='+CSS.supports('selector(::slotted(span))'));
</script></body></html>
