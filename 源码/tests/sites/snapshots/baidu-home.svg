<text x='971.048' y='247.5' font-size='17' fill='#FFFFFF' font-family='sans-serif'> 百度一下 </text>
<rect x='260' y='426' width='55' height='14' rx='0' fill='#EEEEEE' fill-opacity='1'/>
<text x='315' y='440' font-size='14' fill='#9195A3' font-family='sans-serif'></text>
<text x='260' y='460.1' font-size='16' fill='#9195A3' font-family='sans-serif'></text>
<text x='262' y='473.1' font-size='14' fill='#9195A3' font-family='sans-serif'>换一换</text>
<text x='277' y='493' font-size='18' fill='#F63051' font-family='sans-serif'>…</text>
<text x='298' y='484' font-size='16' fill='#222222' font-family='sans-serif'>“信赖” 二字 重千钧</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>老君山现“一山两季”奇观</text>
<text x='280' y='487' font-size='18' fill='#FE2D46' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>大连英博夺得中超冠…</text>
<rect x='455.008' y='469' width='343' height='16' rx='4' fill='#FF6600' fill-opacity='1'/>
<text x='620.508' y='481' font-size='12' fill='#FFFFFF' font-family='sans-serif'>热</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>余文乐《谷雨》演反派火出圈</text>
<text x='280' y='487' font-size='18' fill='#FF6600' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>“这是我来成都之后最伤心的一天”</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>成都蓉城致歉信：深感技不如人</text>
<text x='280' y='487' font-size='18' fill='#FAA90E' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>红色新闻人的浴血征程</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>湖北下雪了</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>秦皇岛暴雪160斤男子被吹出电…</text>
<rect x='529.696' y='469' width='343' height='16' rx='4' fill='#FF455B' fill-opacity='1'/>
<text x='695.196' y='481' font-size='12' fill='#FFFFFF' font-family='sans-serif'>新</text>
<text x='280' y='487' font-size='18' fill='#9195A3' font-family='sans-serif'>…</text>
<text x='302' y='484' font-size='16' fill='#222222' font-family='sans-serif'>立冬后建议改一下睡觉时…</text>
<rect x='487.008' y='469' width='343' height='16' rx='4' fill='#FF455B' fill-opacity='1'/>
<text x='652.508' y='481' font-size='12' fill='#FFFFFF' font-family='sans-serif'>新</text>
