<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>GPS 首次定位</title>
<style>
body{font-family:sans-serif;padding:12px}
h1{font-size:18px}
#log{font-size:14px;white-space:pre-wrap;background:#f5f5f5;padding:10px;border:1px solid #ddd}
</style></head>
<body>
<h1>GPS 首次定位（自动）</h1>
<pre id="log">starting…</pre>
<script>
function log(s){ document.getElementById('log').innerHTML += '\n' + s; }
function fmt(p){ return 'lat=' + p.coords.latitude.toFixed(6) + ' lon=' + p.coords.longitude.toFixed(6) + ' acc=' + p.coords.accuracy; }
log('ready, auto in 1s');
setTimeout(function(){
  var t0 = Date.now();
  log('[auto] high accuracy start');
  navigator.geolocation.getCurrentPosition(function(p){
    log('[auto ok] ' + fmt(p) + ' ms=' + (Date.now() - t0));
  }, function(e){
    log('[auto err] code=' + e.code + ' ' + e.message + ' ms=' + (Date.now() - t0));
  }, { enableHighAccuracy: true, timeout: 15000 });
}, 1000);
</script>
</body></html>
