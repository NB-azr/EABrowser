<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>touch / pointer / scroll 自检</title>
<style>
body{margin:0;padding:14px;font-family:sans-serif;font-size:18px}
#pad{height:460px;background:#eef4ff;border:1px solid #c8d8ff}
#log{font-family:monospace;font-size:16px;white-space:pre-line;margin-top:10px;line-height:1.5}
.filler{height:120px;background:#f7f7f7;border:1px dashed #ddd;margin-top:10px}
</style></head>
<body>
<div id="pad">这里滑动/点击</div>
<div id="l1">l1</div><div id="l2">l2</div><div id="l3">l3</div>
<div class="filler">下面这些块用于制造滚动空间</div>
<div class="filler">rolling block</div>
<div class="filler">rolling block</div>
<div class="filler">rolling block</div>
<div class="filler">rolling block</div>
<div class="filler">rolling block</div>
<script>
var n = {ts:0,tm:0,te:0,tc:0,pd:0,pm:0,pu:0,pc:0,sc:0,click:0};
function dump(){
  document.getElementById('l1').textContent = 'touch  start=' + n.ts + ' move=' + n.tm + ' end=' + n.te + ' cancel=' + n.tc;
  document.getElementById('l2').textContent = 'pointer down=' + n.pd + ' move=' + n.pm + ' up=' + n.pu + ' cancel=' + n.pc;
  document.getElementById('l3').textContent = 'scroll=' + n.sc + ' click=' + n.click + ' y=' + Math.round(window.pageYOffset || 0);
}
var pad = document.getElementById('pad');
function on(el, t, k){ el.addEventListener(t, function(){ n[k]++; dump(); }, false); }
on(pad,'touchstart','ts'); on(pad,'touchmove','tm'); on(pad,'touchend','te'); on(pad,'touchcancel','tc');
on(pad,'pointerdown','pd'); on(pad,'pointermove','pm'); on(pad,'pointerup','pu'); on(pad,'pointercancel','pc');
on(pad,'click','click');
window.addEventListener('scroll', function(){ n.sc++; dump(); }, false);
dump();
</script>
</body></html>
