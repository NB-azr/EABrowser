<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>切页释放</title>
<style>
body{font-family:sans-serif;padding:12px}
video{width:320px;height:240px;background:#111;display:block;margin:8px 0}
#log{font-size:13px;white-space:pre-wrap;background:#f5f5f5;padding:10px;border:1px solid #ddd}
</style></head>
<body>
<h1 style="font-size:18px">切页释放相机</h1>
<video id="v" playsinline></video>
<pre id="log">loading…</pre>
<script>
function log(s){ document.getElementById('log').innerHTML += '\n' + s; }
setTimeout(function(){
  navigator.mediaDevices.getUserMedia({ video: true }).then(function(s){
    var v = document.getElementById('v');
    v.srcObject = s;
    log('[nav] cam on, 3s 后跳转');
    setTimeout(function(){
      log('[nav] goto t_gps.html');
      try { location.href = 't_gps.html'; } catch(e){ log('[nav] err ' + e.message); }
    }, 3000);
  }, function(e){ log('[nav err] ' + e.name); });
}, 800);
</script>
</body></html>
