<!DOCTYPE html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
body{margin:0;background:#f5f6fa}
.searchboxtop{padding:10px 0 8px 0;position:relative}
.se-form{position:relative;clear:both;margin-left:.17rem;margin-right:.17rem;background:#fff;box-sizing:content-box;margin-bottom:2px;z-index:2;border:1px solid #4e6ef2;border-radius:12px;height:42px}
.search-wrap{width:100%;height:100%}
.con-wrap{width:100%;height:100%;box-sizing:border-box;display:flex;align-items:center}
.con-wrap .con-inner-left{flex:1;display:flex;align-items:center;border-top-left-radius:12px;border-bottom-left-radius:12px}
.se-input{flex:1;padding:6px 5px;height:44px;line-height:30px;margin:0;font-size:18px;-webkit-box-sizing:border-box;box-sizing:border-box;background-color:transparent;border:0;width:0}
.se-form .se-input{height:42px}
.se-bn{display:block;text-align:center;box-sizing:border-box;width:96px;color:#fff;background-color:#4e6ef2;border-top-right-radius:10.5px;border-bottom-right-radius:10.5px;position:absolute;right:0;top:0;height:42px;line-height:42px;border:0}
.after{height:60px;background:#ddd}
</style></head>
<body>
<div class="searchboxtop" id="top"><form class="se-form" id="f1"><div class="search-wrap" id="wrap"><div class="con-wrap" id="con"><div class="con-inner-left" id="left"><input id="q" class="se-input" value="hello"></div></div></div><button id="bn" class="se-bn">百度一下</button></form></div>
<div class="after" id="after"></div>
</body></html>
