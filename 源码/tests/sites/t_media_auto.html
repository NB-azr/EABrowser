<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>自动摄像头</title>
<style>
body{font-family:sans-serif;padding:12px}
video{width:320px;height:240px;background:#111;display:block;margin:8px 0}
#log{font-size:13px;white-space:pre-wrap;background:#f5f5f5;padding:10px;border:1px solid #ddd;min-height:60px}
</style></head>
<body>
<h1 style="font-size:18px">自动 getUserMedia</h1>
<video id="v" playsinline></video>
<pre id="log">loading…</pre>
<script>
function log(s){ document.getElementById('log').innerHTML += '\n' + s; }
setTimeout(function(){
  log('[auto] request…');
  navigator.mediaDevices.getUserMedia({ video: true }).then(function(s){
    var v = document.getElementById('v');
    v.srcObject = s;
    try { v.play(); } catch(e){}
    var t = s.getVideoTracks()[0];
    log('[auto ok] id=' + s.id + ' tracks=' + s.getTracks().length + ' state=' + (t && t.readyState) + ' attr=' + v.getAttribute('data-ea-media') + ' vw=' + v.videoWidth + 'x' + v.videoHeight);
  }, function(e){ log('[auto err] ' + e.name + ' ' + e.message); });
}, 800);
</script>
</body></html>
