</style></head><body>
<div class="row" id="p1"><div class="box" id="p1a">hello</div><div class="box" id="p1b" style="flex:0 0 200px">R</div></div>
<div class="row" id="p2"><div class="box" id="p2a">hello world foo bar baz</div><div class="box" id="p2b" style="flex:0 0 200px">R</div></div>
<div class="row" id="p3"><div class="box" id="p3a" style="flex:0 1 auto;min-width:0">hello world foo bar baz</div><div class="box" id="p3b" style="flex:0 0 200px">R</div></div>
</body></html>
