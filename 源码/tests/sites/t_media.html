<!DOCTYPE html>
<html><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>摄像头预览</title>
<style>
body{font-family:sans-serif;padding:12px}
h1{font-size:18px}
video{width:320px;height:240px;background:#111;display:block;margin:8px 0}
.btn{display:block;width:100%;height:44px;margin:6px 0;border:0;border-radius:8px;background:#4285f4;color:#fff;font-size:15px}
.btn.gray{background:#9e9e9e}
#log{font-size:13px;white-space:pre-wrap;background:#f5f5f5;padding:10px;border:1px solid #ddd;min-height:60px}
</style></head>
<body>
<h1>getUserMedia 预览</h1>
<video id="v" playsinline></video>
<button class="btn" onclick="openCam()">开摄像头（video）</button>
<button class="btn gray" onclick="openBoth()">video + audio</button>
<button class="btn gray" onclick="closeCam()">关摄像头</button>
<pre id="log">ready</pre>
<script>
var stream = null;
function log(s){ document.getElementById('log').innerHTML += '\n' + s; }
function openCam(){
  log('[gum] request video…');
  navigator.mediaDevices.getUserMedia({ video: true }).then(function(s){
    stream = s;
    var v = document.getElementById('v');
    try { v.srcObject = s; } catch(e){ log('[gum] srcObject err ' + e.message); }
    try { v.play(); } catch(e){ }
    var tr = s.getVideoTracks()[0];
    log('[gum ok] id=' + s.id + ' tracks=' + s.getTracks().length + ' state=' + (tr && tr.readyState) + ' attrs=' + v.getAttribute('data-ea-media'));
  }, function(e){ log('[gum err] ' + e.name + ' ' + e.message); });
}
function openBoth(){
  log('[gum] request video+audio…');
  navigator.mediaDevices.getUserMedia({ video: true, audio: true }).then(function(s){
    log('[gum ok both] tracks=' + s.getTracks().length);
  }, function(e){ log('[gum err] ' + e.name + ' ' + e.message); });
}
function closeCam(){
  if(!stream){ log('[close] no stream'); return; }
  stream.getVideoTracks()[0].stop();
  log('[close] stopped, active=' + stream.active + ' attr=' + document.getElementById('v').getAttribute('data-ea-media'));
}
</script>
</body></html>
