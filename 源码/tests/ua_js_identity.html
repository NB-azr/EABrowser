<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>JS 看到的设备身份</title>
<style>
  body { margin: 0; padding: 10px; background: #ffffff; }
  #log { font-size: 14px; color: #111111; }
</style>
</head>
<body>
  <div id="log">pending</div>
  <script>
  (function () {
    var nav = navigator;
    var ua = String(nav.userAgent);
    var kind = ua.indexOf('Windows') >= 0 ? 'desktop' : 'mobile';
    var parts = [
      kind,
      String(nav.platform),
      'mtp=' + nav.maxTouchPoints,
      'dpr=' + devicePixelRatio,
      'screen=' + screen.width + 'x' + screen.height,
      'win=' + innerWidth + 'x' + innerHeight,
      'w1000=' + (matchMedia('(min-width:1000px)').matches ? '1' : '0'),
      'touch=' + (('ontouchstart' in window) ? '1' : '0')
    ];
    document.getElementById('log').textContent = parts.join(' | ');
  })();
  </script>
</body>
</html>
