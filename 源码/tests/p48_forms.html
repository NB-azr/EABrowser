<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font-size: 15px; background: #fff; }
.row { margin: 8px; }
</style></head>
<body>
<div class="row"><button id="btn">按钮 Button</button>
<button id="btnDis" disabled>禁用按钮</button></div>
<div class="row"><input id="txt" placeholder="请输入内容">
<input id="txtFocus" value="聚焦输入框"></div>
<div class="row"><input id="dis" value="禁用输入" disabled>
<input id="pwd" type="password" value="secret123"></div>
<div class="row"><input id="date" type="date">
<input id="dateVal" type="date" value="2026-11-08"></div>
<div class="row"><input id="rng" type="range" value="30" min="0" max="100">
<input id="rng2" type="range" value="75" min="0" max="100"></div>
<div class="row"><input id="color" type="color" value="#ff6600">
<input id="file" type="file"></div>
<div class="row"><select id="sel"><option>选项一</option><option>选项二</option></select>
<select id="selDis" disabled><option>禁用选择</option></select></div>
<div class="row"><textarea id="ta" placeholder="多行文本">多行输入内容</textarea></div>
<div class="row"><input id="cb" type="checkbox" checked>
<input id="cb2" type="checkbox">
<input id="rd" type="radio" checked name="g">
<input id="rd2" type="radio" name="g"></div>
<p id="para">这段文字用于插入光标与选区测试 ABC 123</p>
</body></html>
