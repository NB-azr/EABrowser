<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>多栏块级子节点</title>
<style>
  body { margin: 0; padding: 10px; }
  #cols { width: 600px; height: 200px; column-count: 2; column-gap: 20px; }
  #cols p { height: 90px; margin: 0; background: #dbeafe; font-size: 16px; }
</style>
</head>
<body>
<!-- 每段 90px，栏高 200px：前两段第一栏，第三段第二栏 -->
<div id="cols">
  <p id="p1">第一段</p>
  <p id="p2">第二段</p>
  <p id="p3">第三段</p>
</div>
</body>
</html>
