<!DOCTYPE html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font-family: sans-serif; font-size: 14px; }
  table { border-collapse: separate; border: 1px solid #999; margin-bottom: 12px; }
  td, th { border: 1px solid #999; padding: 3px 6px; }
  .fix td { }
  #t-auto { width: 800px; }
  #t-fixed { width: 400px; }
  #colgroup td { border: 1px solid #777; }
  #collapse { border-collapse: collapse; }
  #collapse td { border: 1px solid #c00; }
</style>
</head>
<body>

<!-- 1. 纯内容宽度：短列不应被拉成等宽 -->
<table id="t-auto">
  <tr><td id="c1">序号</td><td id="c2">产品名称与一句较长的说明文字用于撑开这一列</td><td id="c3">价</td></tr>
  <tr><td>1</td><td>Keyboard</td><td>99</td></tr>
</table>

<!-- 2. 固定宽 400，长词与换行 -->
<table id="t-fixed">
  <tr><th id="f1">列一</th><th id="f2">列二带一点长内容</th><th id="f3">X</th></tr>
  <tr><td>短</td><td>Supercalifragilisticexpialidocious</td><td>1</td></tr>
</table>

<!-- 3. colspan 跨列 -->
<table id="t-span" width="500">
  <tr><td id="s1">A</td><td id="s2">B 比较长的一列内容</td><td id="s3">C</td></tr>
  <tr><td colspan="2" id="s4">横跨两列的说明文字，其最小宽度影响两列分配</td><td id="s5">D</td></tr>
</table>

<!-- 4. colgroup 百分比 -->
<table id="colgroup">
  <colgroup><col width="20%"><col width="50%"><col></colgroup>
  <tr><td id="g1">20%</td><td id="g2">50%</td><td id="g3">剩余</td></tr>
</table>

<!-- 5. 无 tr，直接 td -->
<table id="loose">
  <td id="l1">直接</td>
  <td id="l2">放在 table 下的 td</td>
</table>

<!-- 6. border-collapse:collapse -->
<table id="collapse" width="300">
  <tr><td id="k1">a</td><td id="k2">b</td></tr>
  <tr><td>c</td><td>d</td></tr>
</table>

</body></html>
