<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>

#c { width: 180px; aspect-ratio: 1; background: #cc00ff; }

<div id="a"></div>
<div id="b"></div>
<div id="c"></div>
<div id="d"></div>
