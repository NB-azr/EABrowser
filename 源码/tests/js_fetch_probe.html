<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>fetch 二进制探针</title></head>
<body><div id="o">init</div>
<script>
window.__R = "init";
window.__LOG = [];
function log(s){ window.__LOG.push(String(s)); var o=document.getElementById("o"); if(o) o.textContent=window.__LOG.join("\n"); }
function baseDir(){ var h=String(location.href||"").replace(/\\/g,"/"); return h.substring(0,h.lastIndexOf("/")+1); }
log("href=" + location.href);
fetch("ea://file?path=" + encodeURIComponent(baseDir()+"fixtures/sample3.pdf")).then(function(r){
  log("status="+r.status+" ok="+r.ok+" url="+r.url);
  return r.arrayBuffer();
}).then(function(ab){
  log("bytes="+ab.byteLength);
  var u8 = new Uint8Array(ab);
  log("head="+String.fromCharCode(u8[0])+String.fromCharCode(u8[1])+String.fromCharCode(u8[2])+String.fromCharCode(u8[3]));
  window.__R = window.__LOG.join(" | ");
}).catch(function(e){ window.__R = "ERR " + (e && e.message ? e.message : e); });
</script>
</body></html>
