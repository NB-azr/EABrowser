<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; font-size: 16px; color: #222; }
  /* 竖排容器：块级子节点应沿列方向排布（vertical-rl 从右往左） */
  .vt {
    writing-mode: vertical-rl;
    height: 120px;
    width: 400px;
    background-color: #F5F5F5;
    padding: 5px;
  }
  .vt h3 { margin: 0; font-size: 16px; color: #C62828; }
  .vt p { margin: 0; }
  /* 含块级后代的元素整体占一栏 */
  .panel {
    width: 60px;
    background-color: #E3F2FD;
    border: 1px solid #1565C0;
  }
  .panel p { color: #0D47A1; }
</style>
</head>
<body>
  <div class="vt">
    <h3>标题</h3>
    <p>第一段文字第二段文字第三段文字</p>
    <p>第四段文字</p>
    <div class="panel"><p>面板内文字</p></div>
    <p>尾段</p>
  </div>
</body>
</html>
