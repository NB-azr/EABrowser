<!doctype html>
<html><head><meta charset="utf-8">
<title>SELECTION 最小对照页</title>
<style>
  body { margin: 0; background: #ffffff; color: #111; font: 16px/1.7 sans-serif; }
  h1 { font-size: 17px; margin: 12px 12px 4px; }
  .hint { font-size: 12px; color: #666; margin: 0 12px 10px; }
  p { margin: 6px 12px; padding: 8px; border: 1px solid #e0e0e0; }
  /* 默认选区：不透明黄底黑字（验证“必须重绘文字”） */
  ::selection { background: #ffeb3b; color: #000000; }
  /* 第二行：不透明蓝底白字 */
  .host::selection { background: #3366ff; color: #ffffff; }
  /* 第六行：半透明蓝底白字（验证 alpha 叠加后文字仍可见） */
  .alpha::selection { background: rgba(0, 128, 255, 0.45); color: #ffffff; }
  .center { text-align: center; }
  .right { text-align: right; }
  .tall { padding: 14px; }
</style></head>
<body>
<h1>SELECTION：选中背景 + 选区文字色</h1>
<p class="hint">长按拖动选中下面各行；每行底部会标出期望效果。</p>

<p class="tall">第一行 左对齐：选中后应是黄底黑字，文字形状完整（不能被底色盖掉）。</p>
<p class="tall host">第二行 不透明蓝底白字：::selection 指定 background-color 与 color。</p>
<p class="tall center">第三行 居中：选中后底色覆盖本行，文字仍居中。</p>
<p class="tall right">第四行 右对齐：选中后文字仍贴右边界。</p>
<p class="tall"><b>第五行 粗体文本</b> 与 <i>斜体文本</i>：选中后字重/字形必须保留。</p>
<p class="tall alpha">第六行 半透明选区：白字 + 45% 蓝底，文字必须可见。</p>
</body></html>
