<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; background: #ffffff; }
  .row { padding: 10px 20px; }
  svg { display: inline-block; vertical-align: top; margin-right: 12px; }
  #ico { width: 64px; height: 64px; color: #2b6cff; }
  #big { width: 120px; height: 60px; }
</style>
</head>
<body>
<div class="row">
  <!-- viewBox 缩放：100x100 用户单位 -> 64x64 -->
  <svg id="ico" viewBox="0 0 100 100">
    <rect x="10" y="10" width="30" height="20" rx="6" fill="#e74c3c"/>
    <circle cx="70" cy="22" r="12" fill="#3498db"/>
    <ellipse cx="30" cy="65" rx="18" ry="10" fill="#2ecc71"/>
    <line x1="55" y1="55" x2="90" y2="55" stroke="#9b59b6" stroke-width="4"/>
    <polyline points="55,65 65,75 80,60" stroke="#e67e22" stroke-width="3"/>
    <polygon points="12,92 28,72 44,92" stroke="#16a085" stroke-width="3"/>
    <path d="M 50 90 C 60 70, 80 70, 95 90" stroke="#c0392b" stroke-width="3"/>
  </svg>

  <!-- 组继承 + translate + currentColor -->
  <svg id="big" viewBox="0 0 120 60">
    <g fill="currentColor" opacity="0.9">
      <rect x="0" y="0" width="20" height="20"/>
      <rect x="24" y="0" width="20" height="20" transform="translate(4, 6)"/>
      <text x="4" y="46" font-size="16" fill="#111111">SVG</text>
    </g>
    <use href="#tick" x="80" y="10"/>
    <defs>
      <g id="tick">
        <circle cx="10" cy="10" r="10" fill="#ff9800"/>
        <path d="M 4 10 L 9 15 L 17 6" stroke="#ffffff" stroke-width="3"/>
      </g>
    </defs>
  </svg>

  <!-- 描边矩形（无填充） -->
  <svg id="ico2" viewBox="0 0 40 40" style="width:40px;height:40px">
    <rect x="4" y="4" width="32" height="32" fill="none" stroke="#607d8b" stroke-width="4"/>
    <circle cx="20" cy="20" r="6" fill="#607d8b"/>
  </svg>
</div>
</body>
</html>
