<!DOCTYPE html>

</style></head>

  <tr><td rowspan="2">row span 2</td><td>r2c2</td><td rowspan="2">r2c3 tall</td></tr>
  <tr><td>r3c2</td></tr>
  <tr><td>last1</td><td>last2</td><td>last3</td></tr>
</table>
<table id="t2">
  <tr><td width="200">wide 200</td><td>auto</td></tr>
</table>
</body></html>
