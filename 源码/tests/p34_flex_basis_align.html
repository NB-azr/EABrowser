<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 14px sans-serif; }
  .f { width: 400px; display: flex; background: #eeeeee; margin-bottom: 6px; }
  .f > div { height: 30px; background: #cccccc; }
  /* 百分比 flex-basis：200 / 100 / 100 */
  #a1 { flex-basis: 50%; }
  #a2 { flex-basis: 25%; }
  #a3 { flex-basis: 25%; }
  /* flex 简写含百分比：每项 25% -> 100 */
  #b > div { flex: 1 1 25%; }
  /* flex-basis 优先于 width：c1=60，c2 吃掉剩余 */
  #c1 { width: 300px; flex-basis: 60px; }
  #c2 { flex-grow: 1; }
  /* 多行 align-content：3 列 x 2 行 */
  .m { width: 300px; height: 200px; display: flex; flex-wrap: wrap; margin-bottom: 6px; background: #eeeeee; }
  .m > div { width: 100px; height: 40px; background: #cccccc; }
  #sb { align-content: space-between; }
  #ac { align-content: center; }
  #se { align-content: space-evenly; }
  #sa { align-content: space-around; }
  /* column 方向百分比 basis：25% of 200 -> 50 */
  .col { width: 100px; height: 200px; display: flex; flex-direction: column; background: #eeeeee; }
  .col > div { width: 40px; background: #cccccc; }
  #col > div { flex-basis: 25%; }
</style></head>
<body>
<div class="f" id="a"><div id="a1">a1</div><div id="a2">a2</div><div id="a3">a3</div></div>
<div class="f" id="b"><div id="b1">b1</div><div id="b2">b2</div><div id="b3">b3</div><div id="b4">b4</div></div>
<div class="f" id="c"><div id="c1">c1</div><div id="c2">c2</div></div>

<div class="m" id="sb"><div id="sb1">1</div><div id="sb2">2</div><div id="sb3">3</div><div id="sb4">4</div><div id="sb5">5</div><div id="sb6">6</div></div>
<div class="m" id="ac"><div id="ac1">1</div><div id="ac2">2</div><div id="ac3">3</div><div id="ac4">4</div><div id="ac5">5</div><div id="ac6">6</div></div>
<div class="m" id="se"><div id="se1">1</div><div id="se2">2</div><div id="se3">3</div><div id="se4">4</div><div id="se5">5</div><div id="se6">6</div></div>
<div class="m" id="sa"><div id="sa1">1</div><div id="sa2">2</div><div id="sa3">3</div><div id="sa4">4</div><div id="sa5">5</div><div id="sa6">6</div></div>

<div class="col" id="col"><div id="col1">1</div><div id="col2">2</div><div id="col3">3</div></div>
</body></html>
