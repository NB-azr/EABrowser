<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>pdf.js 文本型 PDF（fillText 字形）</title></head>
<body>
<div id="log"></div>
<script src="fixtures/pdf.min.js"></script>
<script src="fixtures/pdf.worker.min.js"></script>
<script>
window.__R = "pending";
window.__LOG = [];
function log(s) { window.__LOG.push(String(s)); var d = document.getElementById("log"); if (d) d.textContent = window.__LOG.join("\n"); }
function baseDir() {
    var h = String(location.href || "").replace(/\\/g, "/");
    return h.substring(0, h.lastIndexOf("/") + 1);
}
(function () {
    try {
        if (typeof pdfjsLib === "undefined") { window.__R = "NO_PDFJS"; return; }
        pdfjsLib.GlobalWorkerOptions.workerSrc = baseDir() + "fixtures/pdf.worker.min.js";
        var url = "ea://file?path=" + encodeURIComponent(baseDir() + "fixtures/text1.pdf");
        fetch(url).then(function (res) { return res.arrayBuffer(); }).then(function (ab) {
            log("pdf bytes=" + ab.byteLength);
            return pdfjsLib.getDocument({ data: ab }).promise;
        }).then(function (doc) {
            log("pages=" + doc.numPages);
            return doc.getPage(1).then(function (page) {
                var vp = page.getViewport({ scale: 2 });
                var canvas = document.createElement("canvas");
                canvas.width = Math.ceil(vp.width);
                canvas.height = Math.ceil(vp.height);
                var ctx = canvas.getContext("2d");
                ctx.fillStyle = "#ffffff";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                document.body.appendChild(canvas);
                return page.render({ canvasContext: ctx, viewport: vp }).promise.then(function () {
                    var d = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
                    var count = 0, minX = 1e9, maxX = -1, minY = 1e9, maxY = -1;
                    for (var y = 0; y < canvas.height; y++) {
                        for (var x = 0; x < canvas.width; x++) {
                            var i = (y * canvas.width + x) * 4;
                            if (d[i] === 255 && d[i + 1] === 0 && d[i + 2] === 0 && d[i + 3] === 255) {
                                count++;
                                if (x < minX) minX = x; if (x > maxX) maxX = x;
                                if (y < minY) minY = y; if (y > maxY) maxY = y;
                            }
                        }
                    }
                    var s = "page1 size=" + canvas.width + "x" + canvas.height + " redPixels=" + count +
                            " bbox=" + minX + "," + minY + "-" + maxX + "," + maxY;
                    log(s);
                    window.__R = window.__LOG.join(" | ");
                });
            });
        }).catch(function (e) {
            window.__R = "ERR " + (e && e.message ? e.message : e) + " @" + (e && e.stack ? String(e.stack).substr(0, 300) : "");
        });
    } catch (e) {
        window.__R = "SYNC_ERR " + (e && e.message ? e.message : e);
    }
})();
</script>
</body></html>
