<!doctype html>
<html><head><meta charset="utf-8"><style>
body{margin:0;padding:0;font-size:16px;color:#222}
ul,ol{margin:8px 0;padding-left:40px}
#u1 li{color:#222}
#u2 li::marker{color:#e91e63;font-size:20px;font-weight:bold}
#u3 li::marker{content:"\2192";color:#0a7d32}
#u4 li::marker{content:"\2605";color:#1a73e8;font-size:22px;font-weight:bold}
#u5{list-style:none}
#u5 li::marker{content:"\2022";color:#ff9800}
#u6{list-style:none}
#u6 li::marker{content:none}
</style></head>
<body>
<ul id="u1"><li>default dot</li></ul>
<ul id="u2"><li>big pink marker</li></ul>
<ul id="u3"><li>arrow literal</li></ul>
<ol id="u4"><li>star marker</li><li>second</li></ol>
<ul id="u5"><li>bullet despite list-style none</li></ul>
<ul id="u6"><li>no marker</li></ul>
</body></html>
