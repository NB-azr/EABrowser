<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; height: 100%; background: #F5F7FA; }
#multi {
  position: absolute; left: 40px; top: 40px; width: 300px; height: 120px;
  background: #FFFFFF;
  box-shadow: 0 1px 2px rgba(0, 0, 0, 0.2), 0 8px 24px rgba(0, 0, 0, 0.35);
}
#spread {
  position: absolute; left: 40px; top: 220px; width: 300px; height: 120px;
  background: #FFFFFF;
  box-shadow: 0 0 0 6px rgba(76, 141, 246, 0.9);
}
#inset {
  position: absolute; left: 40px; top: 400px; width: 300px; height: 120px;
  background: #FFFFFF;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.4);
}
#plain {
  position: absolute; left: 40px; top: 560px; width: 300px; height: 80px;
  background: #FFFFFF;
}
</style>
</head>
<body>
<div id="multi"></div>
<div id="spread"></div>
<div id="inset"></div>
<div id="plain"></div>
</body>
</html>
