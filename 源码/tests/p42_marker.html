<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font-size: 16px; }
  #la { list-style-type: lower-alpha; }
  #ur { list-style-type: upper-roman; }
  #dz { list-style-type: decimal-leading-zero; }
  #ci { list-style-type: circle; }
  #sq { list-style-type: square; }
  #at li::marker { content: attr(data-k); color: #CC0000; }
  #ct li::marker { content: "(" counter(list-item) ") "; color: #006600; }
  #nn { list-style: none; }
</style></head>
<body>
<ol id="la"><li>a</li><li>b</li><li>c</li><li>d</li><li>e</li></ol>
<ol id="ur"><li>x</li><li>y</li><li>z</li></ol>
<ol id="dz"><li>1</li><li>2</li><li>10</li></ol>
<ul id="ci"><li>c1</li><li>c2</li></ul>
<ul id="sq"><li>s1</li><li>s2</li></ul>
<ul id="at"><li data-k="标签A">A</li><li data-k="标签B">B</li></ul>
<ul id="ct"><li>one</li><li>two</li><li>three</li></ul>
<ul id="nn"><li>none</li></ul>
</body></html>
