<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  body { margin: 0; }
  #a { width: 200px; height: 100px; background: #3498db; transform: translate(50%, 10%); }
  #b { width: 100px; height: 50px; margin-top: 20px; background: #e74c3c; transform: translateX(-25%) scale(1.5); }
  #t { margin-top: 20px; font-size: 20px; transform: translate(10px, -5px); }
</style>
</head>
<body>
  <div id="a"></div>
  <div id="b"></div>
  <div id="t">moved text</div>
</body>
</html>
