<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>::before / ::after 生成内容</title>
<style>
  body { margin: 0; padding: 10px; font-size: 16px; line-height: 22px; }
  .q::before { content: "["; color: #cc0000; }
  .q::after  { content: "]"; }
  #t2::before { content: attr(data-tag); }
  #t3::before { content: "A" "B"; }
  #t4::before { content: open-quote; }
  #t4::after  { content: close-quote; }
  .hide::before { content: "X"; display: none; }
  .m::before, .m::after { content: "*"; }
</style>
</head>
<body>
  <p id="q1" class="q">quote</p>
  <p id="t2" data-tag="TAG-">text</p>
  <p id="t3">multi</p>
  <p id="t4">quoted</p>
  <p id="t5" class="hide">hidden-gen</p>
  <p id="t6" class="m">both</p>
</body>
</html>
