<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font-size: 16px; }
#rtl { direction: rtl; width: 300px; background: #ffe0e0; }
#rtl p { margin: 0; }
#ltr { direction: ltr; width: 300px; background: #e0ffe0; }
#start { width: 300px; text-align: start; background: #e0e0ff; }
#end { width: 300px; text-align: end; background: #fff0cc; }
</style></head>
<body>
<div id="rtl"><p>مرحبا بالعالم</p></div>
<div id="ltr"><p>Hello world</p></div>
<div id="start">start aligned</div>
<div id="end">end aligned</div>
</body></html>
