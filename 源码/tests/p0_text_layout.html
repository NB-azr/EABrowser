<!doctype html>
<html><head><style>
body { font-size: 16px; margin: 0; }
#u { text-decoration: underline; }
#st { text-decoration: line-through; }
#ov { text-decoration: overline; }
#both { text-decoration: underline line-through; }
#tt1 { text-transform: uppercase; }
#tt2 { text-transform: lowercase; }
#tt3 { text-transform: capitalize; }
#ff { font-family: "Helvetica Neue", Arial, sans-serif; }
#va { width: 240px; height: 60px; }
#va img { width: 20px; height: 20px; }
</style></head>
<body>
<div id="u">underline text</div>
<div id="st">strike text</div>
<div id="ov">overline text</div>
<div id="both">both decorations</div>
<div id="tt1">upper me</div>
<div id="tt2">LOWER ME</div>
<div id="tt3">capitalize this title</div>
<div id="ff">font family text</div>
<div id="va">before <img src="x.png" id="vi" style="vertical-align:middle"> after</div>
</body></html>
