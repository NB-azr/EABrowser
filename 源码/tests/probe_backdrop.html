<!doctype html><html><head><meta charset="utf-8"><style>
dialog::backdrop{background-color:rgba(0,0,0,0.5);color:rgb(255,0,0)}
#plain::backdrop{background-color:rgb(0,255,0)}
</style></head><body>
<dialog id="d"><p>x</p></dialog>
<div id="plain"></div>
<script>
var d=document.getElementById('d');
console.log('[N2] backdrop bg='+getComputedStyle(d,'::backdrop').backgroundColor+
  ' color='+getComputedStyle(d,'::backdrop').color);
console.log('[N2] supports backdrop='+CSS.supports('selector(::backdrop)'));
</script></body></html>
