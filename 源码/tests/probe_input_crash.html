<!doctype html><html><head><meta charset="utf-8"></head><body>
<div id="wrap"><input id="t" type="text" value=""></div>
<script>
function log(s){ var d=document.getElementById('out'); if(d) d.appendChild(document.createTextNode(s+"; ")); }
var a = document.createElement("input");
a.value = "t";
log("A ok");
var b = document.createElement("div");
b.innerHTML = "<input type='checkbox'><a href='/a'>a</a>";
log("B ok");
var t = document.getElementById('t');
t.value = "hello";
log("C ok");
t.oninput = function(){ var w = document.getElementById('wrap'); w.innerHTML = ''; };
t.value = "world";
log("D ok");
</script>
<div id="out"></div>
</body></html>
