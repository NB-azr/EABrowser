<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; font-size: 14px; }
#list { width: 300px; height: 600px; background: #f0f0f0; }
#head { position: sticky; top: 10px; height: 30px; background: #ff6600; }
#pad { height: 40px; background: #dddddd; }
#foot { height: 30px; background: #336699; }
#rel { position: relative; top: 6px; left: 4px; width: 120px; height: 20px; background: #99cc99; }
</style></head>
<body>
<div id="list">
  <div id="pad"></div>
  <div id="head">sticky header</div>
  <div id="rel"></div>
  <div id="foot"></div>
</div>
</body></html>
