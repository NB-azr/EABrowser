<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 12px sans-serif; }
  .c { width: 200px; height: 120px; background: rgb(0, 160, 0); margin: 8px; }
  /* url() 蒙版 + 显式位置/尺寸/重复 */
  #m1 { mask-image: url(mask1.png); mask-size: 64px 64px; mask-repeat: repeat-x; mask-position: 10% 20%; }
  /* 简写：渐变 + 百分比尺寸 + no-repeat + luminance */
  #m2 { mask: linear-gradient(to bottom, #000, transparent) 0 0 / 100% 50% no-repeat; mask-mode: luminance; }
  /* webkit 前缀 */
  #m3 { -webkit-mask-image: url(mask2.png); -webkit-mask-size: contain; -webkit-mask-position: right center; }
  /* clip-path 与 mask 合并：应只下发一条 CLIP_PUSH，clipKind=2 且带 mask */
  #m4 { clip-path: polygon(0 0, 100% 0, 0 100%); mask-image: url(mask3.png); mask-size: cover; }
  /* none 清空 */
  #m5 { mask-image: url(mask4.png); }
  #m5.none { mask-image: none; }
</style></head>
<body>
<div class="c" id="m1">a</div>
<div class="c" id="m2">b</div>
<div class="c" id="m3">c</div>
<div class="c" id="m4">d</div>
<div class="c none" id="m5">e</div>
</body></html>
