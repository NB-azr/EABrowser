<!DOCTYPE html>
<html>
<head>
<style>
html, body { margin: 0; height: 100%; }
#inset { position: absolute; inset: 20px; background: #E8F0FE; }
#pctpos { position: absolute; left: 50%; top: 25%; width: 200px; height: 100px; background: #F05A28; }
#full { height: 100%; background: #E3F2FD; }
#half { height: 50%; background: #C8E6C9; }
#right { position: absolute; right: 0; bottom: 0; width: 120px; height: 80px; background: #4C8DF6; }
</style>
</head>
<body>
<div id="full">满高</div>
<div id="half">半高</div>
<div id="inset"></div>
<div id="pctpos"></div>
<div id="right"></div>
</body>
</html>
