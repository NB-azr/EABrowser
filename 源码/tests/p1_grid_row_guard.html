<!doctype html><html><head><meta charset="utf-8">
<style>
  body{margin:0}
  #g{display:grid;grid-template-columns:repeat(3, 100px);width:300px;gap:2px}
  #g > div{height:20px;background:#9cf}
</style>
</head><body>
<div id="g">
  <div id="r1" style="grid-row:9999999">a</div>
  <div id="r2" style="grid-row-start:9999999;grid-column-start:2">b</div>
  <div id="r3" style="grid-row:span 9999999">c</div>
</div>
<script>
(function(){
  function r(id){ var b=document.getElementById(id).getBoundingClientRect(); return id+'='+Math.round(b.width)+'x'+Math.round(b.height); }
  console.log('[GRID] ' + r('g') + ' ' + r('r1') + ' ' + r('r2') + ' ' + r('r3'));
})();
</script>
</body></html>
