<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>多栏文本</title>
<style>
  body { margin: 0; padding: 10px; background: #ffffff; }
  #cols {
    width: 600px;
    column-count: 2;
    column-gap: 20px;
    font-size: 16px;
    line-height: 24px;
    color: #111111;
  }
</style>
</head>
<body>
<!-- 纯文本多栏：按栏宽 290px 换行，再平分到两栏 -->
<div id="cols">春眠不觉晓，处处闻啼鸟。夜来风雨声，花落知多少。白日依山尽，黄河入海流。欲穷千里目，更上一层楼。床前明月光，疑是地上霜。举头望明月，低头思故乡。红豆生南国，春来发几枝。愿君多采撷，此物最相思。空山不见人，但闻人语响。返景入深林，复照青苔上。</div>
</body>
</html>
