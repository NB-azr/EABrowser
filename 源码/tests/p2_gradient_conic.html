<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; }
#linear { width: 200px; height: 60px; background: linear-gradient(to right, #ff0000, #0000ff); }
#radial { width: 200px; height: 60px; background: radial-gradient(circle at center, #00ff00, #000000); }
#conic { width: 200px; height: 60px; background: conic-gradient(from 90deg at center, #ff0000, #00ff00, #0000ff); }
#conic2 { width: 200px; height: 60px; background: repeating-conic-gradient(red 0deg, blue 90deg); }
</style></head>
<body>
<div id="linear"></div><div id="radial"></div><div id="conic"></div><div id="conic2"></div>
</body></html>
