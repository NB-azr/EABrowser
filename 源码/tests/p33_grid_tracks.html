<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 14px sans-serif; }
  .g { width: 500px; display: grid; column-gap: 10px; row-gap: 10px; background: #eeeeee; }
  .g > div { background: #cccccc; }
  #a { grid-template-columns: 100px 1fr 2fr; }
  #b { grid-template-columns: auto 1fr; }
  #c { grid-template-columns: minmax(150px, 1fr) minmax(200px, 2fr); }
  #d { grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); }
  #e { grid-template-columns: auto auto; }
  #f { grid-template-columns: 30% 1fr; }
  #b1 { width: 120px; }
</style></head>
<body>
<div class="g" id="a"><div id="a1">a1</div><div id="a2">a2</div><div id="a3">a3</div></div>
<div class="g" id="b"><div id="b1">b1</div><div id="b2">b2</div></div>
<div class="g" id="c"><div id="c1">c1</div><div id="c2">c2</div></div>
<div class="g" id="d"><div id="d1">d1</div><div id="d2">d2</div><div id="d3">d3</div><div id="d4">d4</div></div>
<div class="g" id="e"><div id="e1">short</div><div id="e2">a much longer text cell</div></div>
<div class="g" id="f"><div id="f1">f1</div><div id="f2">f2</div></div>
</body></html>
