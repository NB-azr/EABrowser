<!doctype html>
<html><head><meta charset="utf-8"><title>srcpos</title></head>
<body>
<div id="a">
  <p class="x">p1</p>
</div>
<div id="b"><span>s1</span></div>
<script>
(function(){
  var out=[];
  var els=[document.getElementById('a'), document.querySelector('#a p'), document.getElementById('b'), document.querySelector('#b span')];
  for (var i=0,n=els.length;i!=n;i++){
    var e=els[i];
    var s=__eaNodeSource(e);
    out.push((e.id||e.tagName)+'='+e.sourceLine+':'+e.sourceColumn+' pos='+s.position);
  }
  console.log('[SRCPOS] '+out.join(' | '));
})();
</script>
</body></html>
