<!DOCTYPE html>
<html><head><meta charset="utf-8"><style>
body { margin: 0; }
@keyframes pulse {
  0%   { opacity: 0.2; background-color: #ff0000; width: 40px; border-radius: 0px; }
  50%  { opacity: 0.8; background-color: #00ff00; width: 80px; border-radius: 10px; }
  100% { opacity: 0.4; background-color: #0000ff; width: 120px; border-radius: 20px; }
}
@keyframes bad {
  0%   { left: 10px; margin-left: 20px; color: #ff0000; }
  100% { left: 30px; margin-left: 40px; color: #0000ff; }
}
#k { width: 40px; height: 40px; background-color: #ff0000; animation: pulse 1s linear infinite; }
#b { width: 100px; height: 20px; background-color: #cccccc; animation: bad 1s linear infinite; }
</style></head>
<body>
<div id="k"></div>
<div id="b"></div>
</body></html>
