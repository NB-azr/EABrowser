<!doctype html>
<html><head><meta charset="utf-8">
<style>
  body { margin: 0; font: 16px sans-serif; }
  div { width: 200px; height: 30px; background: #dddddd; }
  #i:is(.i, .zz) { background: #ff0000; }
  #w:where(#w) { background: #00ff00; }
  #n p:nth-of-type(2) { background: #0000ff; }
  #nx:not(.foo) { background: #ffff00; }
  #n2 p:nth-last-of-type(1) { background: #00ffff; }
  #mix:not(.a):not(.b) { background: #ff00ff; }
</style></head>
<body>
<div class="i" id="i">is</div>
<div class="w" id="w">where</div>
<div id="n"><p>1</p><p>2</p><p>3</p></div>
<div id="nx"><span>x</span></div>
<div id="n2"><p>a</p><p>b</p><p>c</p></div>
<div class="a" id="mix">not</div>
</body></html>
